<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeroHub · Employee Self-Service Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg hh-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand hh-brand" href="#/">
            <span class="hh-logo"><i class="bi bi-lightning-charge-fill"></i></span>HeroHub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hhNav"
                aria-controls="hhNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="hhNav">
            <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item"><a class="nav-link" data-nav="dashboard" href="#/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" data-nav="directory" href="#/employees"><i class="bi bi-people me-1"></i>Directory</a></li>
                <li class="nav-item"><a class="nav-link" data-nav="add" href="#/employees/new"><i class="bi bi-person-plus me-1"></i>Add Employee</a></li>
                <li class="nav-item"><a class="nav-link" data-nav="about" href="#/about"><i class="bi bi-diagram-3 me-1"></i>Architecture</a></li>
            </ul>
            <form class="d-flex hh-nav-search" id="navSearch" role="search">
                <input class="form-control" type="search" id="navSearchInput" placeholder="Search ID, name, dept, role" aria-label="Search">
                <button class="btn btn-hero" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>
    </div>
</nav>

<div id="flash" class="container mt-3"></div>
<main id="app" class="container py-4"></main>

<footer class="hh-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <span><strong>HeroHub</strong> · Employee Self-Service Portal</span>
        <span class="text-muted small">HTML · CSS · JavaScript frontend · Spring Boot API · SQL database</span>
    </div>
</footer>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="deleteModalLabel">Remove employee?</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                This will permanently remove <strong id="deleteName">this employee</strong> from the directory.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="deleteConfirm">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
