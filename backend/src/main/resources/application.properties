spring.application.name=HeroHub
server.port=8080

# Database: H2 in-memory (MySQL mode) by default. Schema and sample data live in /database.
# Paths are relative to the backend/ folder, so start the app from backend/.
spring.datasource.url=jdbc:h2:mem:herohub;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/schema.sql
spring.sql.init.data-locations=file:../database/seed.sql

# Allowed frontend origin(s) for the browser (comma separated, * = any)
herohub.cors.allowed-origins=*
